[build]
  publish = "public"
  functions = "netlify/functions"

[[redirects]]
  from = "/v1/*"
  to = "/.netlify/functions/v1/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/v1"
  to = "/.netlify/functions/v1"
  status = 200
  force = true

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/healthz"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
