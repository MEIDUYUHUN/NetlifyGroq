[build]
  publish = "public"
  functions = "netlify/functions"

# 函数使用 in-source 路由（netlify/functions/v1.mjs 与 healthz.mjs 里的 export const config.path），
# 不要再额外配置 /v1 或 /health 的 redirects：force rewrite 会覆盖函数路由并导致 404。

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
